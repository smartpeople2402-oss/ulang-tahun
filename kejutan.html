<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#24151f" />
<title>Boarding to Brisbane ✈</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@400;500;600;700;800&display=swap');
  
  :root {
    --ink: #261720;
    --plum: #392333;
    --rose: #d99b9d;
    --cream: #fff8f0;
    --gold: #d9b779;
    --muted: #78666f;
    --paper: #fffdfb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'DM Sans', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: radial-gradient(ellipse at 15% 15%, rgba(217,155,157,.15), transparent 40%), 
                radial-gradient(ellipse at 85% 85%, rgba(217,183,121,.15), transparent 40%), 
                linear-gradient(135deg, #fff9f2 0%, #f7e9e5 100%);
    transition: background 1.5s ease, opacity 1s ease;
  }

  /* Animasi Transisi Keluar */
  body.departing {
    background: var(--plum);
  }
  .fade-wrapper {
    transition: opacity 1s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }
  body.departing .fade-wrapper {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 1s ease, transform 1s ease;
  }

  .intro-text {
    text-align: center;
    margin-bottom: 30px;
    z-index: 2;
  }
  .intro-text h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    color: var(--plum);
    font-size: clamp(1.4rem, 4vw, 1.8rem);
    margin: 0 0 10px;
  }
  .intro-text p {
    color: var(--muted);
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    margin: 0;
  }

  /* Boarding Pass Container */
  .ticket {
    display: flex;
    background: var(--paper);
    border-radius: 20px;
    box-shadow: 0 25px 50px rgba(57, 35, 51, 0.12);
    width: 90%;
    max-width: 750px;
    position: relative;
    z-index: 10;
    flex-direction: row;
    overflow: hidden;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* Lingkaran pemisah di tepi tiket */
  .ticket::before, .ticket::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 30px;
    height: 30px;
    background: #fdf5ef; /* Menyamai background body */
    border-radius: 50%;
    transform: translateY(-50%);
    z-index: 2;
  }
  .ticket::before { left: -15px; box-shadow: inset -3px 0 5px rgba(0,0,0,0.02); }
  .ticket::after { right: -15px; box-shadow: inset 3px 0 5px rgba(0,0,0,0.02); }

  /* Bagian Kiri Tiket (Info Utama) */
  .ticket-left {
    flex: 2.5;
    padding: 35px 40px;
    border-right: 2px dashed #e7ded8;
    position: relative;
  }

  .airline-brand {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    color: var(--plum);
    border-bottom: 1px solid rgba(152, 107, 118, 0.2);
    padding-bottom: 15px;
  }
  .airline-brand .name { font-weight: 700; letter-spacing: 0.15em; font-size: 0.8rem; }
  .airline-brand .class { font-family: 'Playfair Display', serif; font-style: italic; color: var(--gold); }

  .route {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
  }
  .city { text-align: center; }
  .city h2 { font-family: 'Playfair Display', serif; font-size: 3.2rem; font-weight: 800; margin: 0; color: var(--plum); line-height: 1; }
  .city span { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; }
  
  .plane-icon {
    font-size: 2rem;
    color: var(--gold);
    transform: rotate(45deg);
    opacity: 0.7;
  }

  .details {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
  }
  .detail-box label { display: block; font-size: 0.65rem; text-transform: uppercase; color: #a58a94; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 3px; }
  .detail-box span { display: block; font-size: 0.9rem; font-weight: 600; color: var(--ink); }
  .passenger-name { grid-column: span 2; }
  .passenger-name span { color: var(--plum); font-size: 1.05rem; }

  /* Bagian Kanan Tiket (Stub & Action) */
  .ticket-right {
    flex: 1;
    background: linear-gradient(135deg, #fff9f0, #faf2e8);
    padding: 35px 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    text-align: center;
  }

  .barcode {
    width: 100%;
    height: 50px;
    background-image: repeating-linear-gradient(to right, var(--plum) 0, var(--plum) 3px, transparent 3px, transparent 6px, var(--plum) 6px, var(--plum) 8px, transparent 8px, transparent 12px, var(--plum) 12px, var(--plum) 18px, transparent 18px, transparent 22px);
    opacity: 0.6;
    margin-top: 10px;
  }
  
  .barcode-text { font-size: 0.65rem; letter-spacing: 0.3em; margin-top: 8px; color: var(--muted); }

  .btn-checkin {
    background: var(--plum);
    color: var(--cream);
    border: none;
    padding: 15px 25px;
    border-radius: 999px;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(57, 35, 51, 0.2);
    transition: all 0.3s ease;
    width: 100%;
    margin-top: 20px;
    position: relative;
    overflow: hidden;
  }
  .btn-checkin:hover {
    transform: translateY(-2px);
    background: #4b2d42;
    box-shadow: 0 12px 25px rgba(57, 35, 51, 0.3);
  }

  /* Stamp Animasi */
  .stamp {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(2) rotate(-15deg);
    border: 4px solid #52675c;
    color: #52675c;
    padding: 5px 15px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .ticket.approved .stamp {
    transform: translate(-50%, -50%) scale(1) rotate(-15deg);
    opacity: 0.9;
  }

  /* Animasi Pesawat Terbang */
  .flying-plane {
    position: fixed;
    font-size: 80px;
    color: var(--cream);
    z-index: 100;
    bottom: -100px;
    left: -100px;
    opacity: 0;
    pointer-events: none;
    filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
  }
  body.departing .flying-plane {
    animation: flyAcross 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  @keyframes flyAcross {
    0% { transform: translate(0, 0) rotate(20deg) scale(0.5); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(120vw, -80vh) rotate(25deg) scale(1.5); opacity: 1; }
  }

  /* Responsif untuk layar HP */
  @media(max-width: 760px) {
    .ticket { flex-direction: column; width: 85%; }
    .ticket-left { border-right: none; border-bottom: 2px dashed #e7ded8; padding: 25px; }
    .ticket-right { padding: 25px; }
    .ticket::before, .ticket::after {
      left: 50%; top: auto; transform: translateX(-50%);
    }
    .ticket::before { top: -15px; }
    .ticket::after { bottom: -15px; }
    .details { grid-template-columns: 1fr 1fr; gap: 12px; }
    .passenger-name { grid-column: span 2; }
    .city h2 { font-size: 2.5rem; }
  }

</style>
</head>
<body>

  <!-- Animasi Latar -->
  <span class="flying-plane" id="animatedPlane">✈</span>

  <div class="fade-wrapper">
    <div class="intro-text">
      <h1>Menjemput Masa Depan</h1>
      <p>Jarak hanya angka, langkah kita adalah nyata.</p>
    </div>

    <!-- Container Tiket -->
    <div class="ticket" id="boardingPass">
      <div class="stamp" id="approvalStamp">CHECKED IN</div>
      
      <!-- Bagian Kiri -->
      <div class="ticket-left">
        <div class="airline-brand">
          <span class="name">✦ CG AIRLINES</span>
          <span class="class">First Class Romance</span>
        </div>

        <div class="route">
          <div class="city">
            <h2>SUB</h2>
            <span>Surabaya</span>
          </div>
          <div class="plane-icon">✈</div>
          <div class="city">
            <h2>BNE</h2>
            <span>Brisbane</span>
          </div>
        </div>

        <div class="details">
          <div class="detail-box passenger-name">
            <label>Passenger</label>
            <span>Kohan Gunawan</span>
          </div>
          <div class="detail-box">
            <label>Flight</label>
            <span>CG-0711</span>
          </div>
          <div class="detail-box">
            <label>Date</label>
            <span>02 NOV 26</span>
          </div>
          <div class="detail-box">
            <label>Gate</label>
            <span>07</span>
          </div>
          <div class="detail-box">
            <label>Seat</label>
            <span>21A</span>
          </div>
          <div class="detail-box passenger-name" style="margin-top: 5px;">
            <label>Destination</label>
            <span style="color: var(--gold); font-style: italic; font-family: 'Playfair Display', serif;">Khairunnisa Rahmahdani</span>
          </div>
        </div>
      </div>

      <!-- Bagian Kanan -->
      <div class="ticket-right">
        <div>
          <div class="barcode"></div>
          <div class="barcode-text">07112024 - 02112026</div>
        </div>
        
        <button class="btn-checkin" id="btnCheckin">Check-in ke Chapter 21</button>
      </div>
    </div>
  </div>

<script>
  const btnCheckin = document.getElementById('btnCheckin');
  const boardingPass = document.getElementById('boardingPass');
  const body = document.body;

  btnCheckin.addEventListener('click', function() {
    // 1. Ubah teks tombol
    btnCheckin.innerHTML = "Memproses...";
    btnCheckin.style.background = "#52675c"; // Hijau success
    btnCheckin.style.pointerEvents = "none"; // Cegah klik ganda

    // 2. Tampilkan stamp "CHECKED IN" di tiket
    setTimeout(() => {
      boardingPass.classList.add('approved');
      btnCheckin.innerHTML = "Berhasil ♡";
    }, 600);

    // 3. Mulai animasi keberangkatan (Pesawat & Fade layarnya)
    setTimeout(() => {
      body.classList.add('departing');
    }, 1800);

    // 4. Pindah ke halaman surat ulang tahun
    setTimeout(() => {
      window.location.href = 'keempat.html'; // Pindah ke file target
    }, 3800); // Redirect setelah animasi pesawat selesai
  });
</script>
</body>
</html>
