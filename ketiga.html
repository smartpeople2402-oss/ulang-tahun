<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#24151f" />
<title>Ada Paket Untukmu ♡</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@400;500;600;700&display=swap');
  
  :root {
    --ink: #261720;
    --plum: #392333;
    --rose: #d99b9d;
    --cream: #fff8f0;
    --gold: #d9b779;
    --muted: #78666f;
  }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'DM Sans', Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 50%, #fffdfb 0%, #f7e9e5 100%);
    transition: background 1.5s ease;
  }

  /* Animasi Transisi Gelap saat Selesai */
  body.success-mode {
    background: var(--plum);
    color: var(--cream);
  }

  .container {
    text-align: center;
    z-index: 10;
    padding: 20px;
    max-width: 500px;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .container.hide {
    opacity: 0;
    transform: translateY(-30px);
    pointer-events: none;
  }

  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    color: var(--plum);
    font-size: clamp(1.8rem, 5vw, 2.5rem);
    margin-bottom: 5px;
  }

  p.subtitle {
    color: var(--muted);
    font-size: 1rem;
    margin-bottom: 40px;
  }

  .counter-badge {
    display: inline-block;
    background: rgba(217, 155, 157, 0.2);
    color: #986b76;
    padding: 6px 16px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    margin-bottom: 30px;
    border: 1px solid rgba(217, 155, 157, 0.4);
    transition: all 0.3s ease;
  }

  /* Kado Interaktif */
  .gift-box {
    font-size: 120px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.1s;
    filter: drop-shadow(0 15px 25px rgba(57, 35, 51, 0.15));
    position: relative;
    display: inline-block;
    -webkit-tap-highlight-color: transparent;
  }

  .gift-box:active {
    transform: scale(0.9) rotate(-3deg);
  }

  /* Animasi Hati saat di-tap */
  .floating-heart {
    position: absolute;
    pointer-events: none;
    animation: floatUp 1.2s ease-out forwards;
    z-index: 5;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(0.5); opacity: 1; }
    100% { transform: translateY(-150px) scale(1.5); opacity: 0; }
  }

  /* Layar Loading LDR */
  .loading-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease 0.5s;
    text-align: center;
    padding: 20px;
  }

  .loading-screen.show {
    opacity: 1;
  }

  .loading-text {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.5rem;
    font-style: italic;
    color: var(--gold);
    opacity: 0;
    transform: translateY(15px);
    transition: opacity 0.8s ease, transform 0.8s ease;
    position: absolute;
  }

  .loading-text.active {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>

  <!-- Bagian Kado Interaktif -->
  <div class="container" id="interactionArea">
    <h1>Paket Khusus</h1>
    <p class="subtitle">Dari Surabaya, dikirim jauh ke Brisbane.<br>Untuk membukanya, ketuk kado ini 21 kali sesuai umurmu hari ini!</p>
    
    <div class="counter-badge" id="counterBadge">KETUKAN: 0 / 21</div>
    
    <div>
      <div class="gift-box" id="giftBox" role="button" aria-label="Ketuk untuk membuka hadiah">🎁</div>
    </div>
  </div>

  <!-- Bagian Transisi Romantis -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-text" id="msg1">Menerima paket rindu...</div>
    <div class="loading-text" id="msg2">Menyatukan jarak Surabaya & Brisbane...</div>
    <div class="loading-text" id="msg3">Membuka Chapter 21... ♡</div>
  </div>

<script>
  const giftBox = document.getElementById('giftBox');
  const counterBadge = document.getElementById('counterBadge');
  const interactionArea = document.getElementById('interactionArea');
  const loadingScreen = document.getElementById('loadingScreen');
  const messages = [document.getElementById('msg1'), document.getElementById('msg2'), document.getElementById('msg3')];
  
  let taps = 0;
  const targetTaps = 21;
  const heartColors = ['#d99b9d', '#d9b779', '#c95d63', '#b86e83'];

  // Fungsi membuat partikel hati saat di tap
  function createHeart(e) {
    const heart = document.createElement('div');
    heart.className = 'floating-heart';
    heart.innerHTML = '♥';
    heart.style.color = heartColors[Math.floor(Math.random() * heartColors.length)];
    heart.style.fontSize = (20 + Math.random() * 20) + 'px';
    
    // Posisi acak di sekitar kado
    const rect = giftBox.getBoundingClientRect();
    const x = e.clientX ? e.clientX : rect.left + rect.width / 2;
    const y = e.clientY ? e.clientY : rect.top + rect.height / 2;
    
    heart.style.left = (x - 15 + (Math.random() * 40 - 20)) + 'px';
    heart.style.top = (y - 20) + 'px';
    
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 1200);
  }

  // Event ketika kado diketuk
  giftBox.addEventListener('click', (e) => {
    if (taps >= targetTaps) return; // Hentikan jika sudah 21
    
    taps++;
    counterBadge.textContent = `KETUKAN: ${taps} / ${targetTaps}`;
    createHeart(e);

    // Ubah warna badge perlahan saat mendekati target
    if (taps > 15) {
      counterBadge.style.background = 'rgba(217, 183, 121, 0.3)';
      counterBadge.style.color = '#7b5c1c';
    }

    // Jika target tercapai
    if (taps === targetTaps) {
      giftBox.innerHTML = '✨💌✨'; // Kado meledak jadi surat
      giftBox.style.transform = 'scale(1.3)';
      
      // Munculkan banyak hati
      for(let i=0; i<15; i++) {
        setTimeout(() => createHeart(e), i * 50);
      }

      // Mulai fase transisi
      setTimeout(startTransition, 1000);
    }
  });

  function startTransition() {
    // Sembunyikan area interaksi dan ubah tema menjadi gelap
    interactionArea.classList.add('hide');
    document.body.classList.add('success-mode');
    loadingScreen.classList.add('show');

    // Sequence Teks Romantis
    setTimeout(() => { showMessage(0); }, 1500); // Pesan 1
    setTimeout(() => { hideMessage(0); showMessage(1); }, 4500); // Pesan 2
    setTimeout(() => { hideMessage(1); showMessage(2); }, 8000); // Pesan 3
    
    // Pindah ke halaman utama setelah selesai
    setTimeout(() => {
      window.location.href = 'ulang tahun.html';
    }, 11000); // Pindah setelah 11 detik
  }

  function showMessage(index) {
    if (messages[index]) messages[index].classList.add('active');
  }

  function hideMessage(index) {
    if (messages[index]) messages[index].classList.remove('active');
  }
</script>
</body>
</html>
